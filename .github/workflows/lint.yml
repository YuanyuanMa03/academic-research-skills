name: Lint & Validate

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md files
        run: python scripts/validate_skills.py

      - name: Check for hardcoded paths
        run: |
          set -o pipefail
          HARDcoded=0

          # Windows drive-letter paths (e.g. C:\, D:/)
          if grep -rnP '(?<![:\w])[a-zA-Z]:[/\\][^\s"'"'"']+' plugins/ \
              --include="*.md" --include="*.json" --include="*.py" \
              --exclude-dir=references --exclude-dir=assets \
              | grep -v 'http' | grep -v 'API'; then
            echo "::error::Hardcoded Windows paths found in plugin files"
            HARDCODED=1
          fi

          # macOS user-home paths
          if grep -rn '/Users/' plugins/ \
              --include="*.md" --include="*.json" --include="*.py" \
              --exclude-dir=references --exclude-dir=assets; then
            echo "::error::Hardcoded macOS paths found in plugin files"
            HARDCODED=1
          fi

          if [ "$HARDCODED" -eq 1 ]; then
            exit 1
          fi
          echo "No hardcoded paths found."

      - name: Validate plugin.json files
        run: python scripts/validate_plugin_json.py

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.8.0

      - name: Lint Python files
        run: ruff check plugins/ scripts/

      - name: Format check
        run: ruff format --check plugins/ scripts/
