name: Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest shared/ --cov=shared --cov-report=term-missing -v

      - name: Check coverage threshold
        run: |
          COVERAGE=$(pytest shared/ --cov=shared --cov-report=term -q | tail -1 | grep -oP '\d+%' | head -1 | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "${COVERAGE:-0}" -lt 60 ]; then
            echo "::warning::Coverage ${COVERAGE}% is below 60% threshold"
          fi
