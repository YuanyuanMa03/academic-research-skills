repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-skills
        name: Validate SKILL.md files
        entry: python scripts/validate_skills.py
        language: python
        pass_filenames: false
        always_run: true

      - id: validate-plugin-json
        name: Validate plugin.json files
        entry: python scripts/validate_plugin_json.py
        language: python
        pass_filenames: false
        always_run: true

      - id: check-shared-assets
        name: Check shared asset drift (.mcp.json)
        entry: python scripts/check_shared_assets.py
        language: python
        pass_filenames: false
        always_run: true

      - id: check-marketplace-consistency
        name: Check marketplace consistency
        entry: python scripts/check_marketplace_consistency.py
        language: python
        pass_filenames: false
        always_run: true

      - id: no-hardcoded-paths
        name: Check for hardcoded paths
        entry: bash -c 'grep -rniE "([a-zA-Z]:[/\\]|/Users/|/home/[a-z])" plugins/ --include="*.md" --include="*.json" --include="*.py" --exclude-dir=references --exclude-dir=assets && exit 1 || exit 0'
        language: system
        pass_filenames: false
