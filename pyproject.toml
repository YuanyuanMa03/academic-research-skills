[tool.ruff]
# Exclude pre-existing scripts that are not part of this PR's changes.
# These files have pre-existing lint issues that will be addressed
# in a follow-up PR focused on each specific plugin.
exclude = [
    "plugins/nature-academic-search/skills/nature-academic-search/mcp-server/",
    "plugins/nature-academic-search/skills/nature-academic-search/scripts/",
    "plugins/nature-citation/skills/nature-citation/scripts/",
    "plugins/nature-figure/skills/nature-figure/assets/",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long (many scripts have long URLs/strings)
    "E722",   # bare except (common in existing scripts)
]
